
<style>
#mysql-erd svg { width: 100%; }
#mysql-erd svg.erDiagram .row-rect-odd path,
#mysql-erd svg.erDiagram .row-rect-odd rect,
#mysql-erd svg.erDiagram .row-rect-even path,
#mysql-erd svg.erDiagram .row-rect-even rect { stroke: none !important; }

#mongo-erd svg { width: 100%; }
#mongo-erd svg.erDiagram .row-rect-odd path,
#mongo-erd svg.erDiagram .row-rect-odd rect,
#mongo-erd svg.erDiagram .row-rect-even path,
#mongo-erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>

<div style="padding:4px 0 2px">
  <span style="font-size:13px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.03em">MySQL — transactional tables</span>
</div>
<div id="mysql-erd"></div>

<div style="padding:4px 0 2px">
  <span style="font-size:13px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.03em">MongoDB — document collections</span>
</div>
<div id="mongo-erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#1e3a52' : '#E6F1FB',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    primaryTextColor: dark ? '#B5D4F4' : '#0C447C',
    secondaryColor: dark ? '#1a3340' : '#E1F5EE',
    tertiaryColor: dark ? '#2a2826' : '#F1EFE8',
  },
});
const diagram = `erDiagram
  users {
    int id PK
    string name
    string email
	string phone
    string password
	AccountRole role
    timestamp created_at
  }
  addresses {
    int id PK
    int user_id FK
    string main_line
    string locality
    string city
    string pincode
	string state
	string country
  }
  carts {
    int id PK
    int user_id FK
	decimal total_amount
    timestamp updated_at
  }
  cart_items {
    int id PK
    int cart_id FK
    string item_id
    int quantity
    string snapshot_name
    string snapshot_image
    decimal snapshot_price
	string variant_label
	string snapshot_category
  }
  orders {
    int id PK
    int user_id FK
    string ship_name
    string ship_flat
    string ship_city
    string ship_pincode
    string status
    decimal total
    timestamp placed_at
  }
  order_items {
    int id PK
    int order_id FK
    string item_id
    int quantity
    string snapshot_name
    string snapshot_image
    decimal snapshot_price
	string variant_label
	string snapshot_category
  }
  sessions {
    int id PK
    int user_id FK
    string token
    timestamp expires_at
  }

  users ||--o{ addresses : "has"
  users ||--|| carts : "owns"
  users ||--o{ orders : "places"
  users ||--o{ sessions : "auth"
  carts ||--o{ cart_items : "contains"
  orders ||--o{ order_items : "contains"
`;
const { svg } = await mermaid.render('mysql-svg', diagram);
document.getElementById('mysql-erd').innerHTML = svg;
document.querySelectorAll('#mysql-erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#mysql-erd svg.erDiagram .row-rect-odd path, #mysql-erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
