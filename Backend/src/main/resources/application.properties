# =====================================
# APPLICATION
# =====================================
spring.application.name=MaisonNoir
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000}

# =====================================
# ACTIVE PROFILE (Switch between 'dev' and 'prod')
# =====================================
# You can leave this blank and pass it via command line, or set it here to 'dev' for local work
# spring.profiles.active=dev

# =====================================
# DATABASE (Base Info)
# =====================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Note: We move the URL/User/Pass to the profile files

# =====================================
# JPA / HIBERNATE (Base Info)
# =====================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Note: DDL-auto, SQL logging, and format SQL are moved to profiles

# =====================================
# SERVER
# =====================================
# Required for Render (This is typically a prod concern, but keeping it here is fine)
server.port=${PORT:8080}