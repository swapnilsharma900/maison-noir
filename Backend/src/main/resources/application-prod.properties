# =====================================
# DATABASE (Production)
# =====================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# =====================================
# JPA / HIBERNATE (Prod Settings)
# =====================================
# NEVER use 'create' in production! Use 'validate' or 'none' and manage schema manually.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=false
# Turn off SQL format
spring.jpa.properties.hibernate.format_sql=false

# =====================================
# LOGGING (Quiet in Prod)
# =====================================
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.orm.jpa=INFO

# =====================================
# MONGODB (Production)
# =====================================
spring.data.mongodb.uri=${MONGODB_URI}

# =====================================
# JWT (Prod Settings)
# =====================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================
# ERROR HANDLING (Prevent leaking internal errors)
# =====================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =====================================
# SQL INIT (Optional - based on your screenshot)
# =====================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false