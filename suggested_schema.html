<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>E-Commerce Database Schema</title>
<style>
  body { font-family: sans-serif; padding: 24px; background: #fff; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #e0e0e0; } }
  h2 { font-size: 15px; font-weight: 500; color: #666; margin: 28px 0 6px; letter-spacing: .03em; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #888; margin: 0 0 24px; }
  #mysql-erd svg, #mongo-erd svg { width: 100%; }
  #mysql-erd svg.erDiagram .row-rect-odd path,
  #mysql-erd svg.erDiagram .row-rect-odd rect,
  #mysql-erd svg.erDiagram .row-rect-even path,
  #mysql-erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
  #mongo-erd svg.erDiagram .row-rect-odd path,
  #mongo-erd svg.erDiagram .row-rect-odd rect,
  #mongo-erd svg.erDiagram .row-rect-even path,
  #mongo-erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
</head>
<body>

<h1>E-Commerce Database Schema</h1>
<p class="sub">Hybrid architecture — MySQL for transactional data, MongoDB for product catalog</p>

<h2>MySQL — transactional tables</h2>
<div id="mysql-erd"></div>

<h2>MongoDB — document collections</h2>
<div id="mongo-erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: 'sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: 'sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#1e3a52' : '#E6F1FB',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    primaryTextColor: dark ? '#B5D4F4' : '#0C447C',
    secondaryColor: dark ? '#1a3340' : '#E1F5EE',
    tertiaryColor: dark ? '#2a2826' : '#F1EFE8',
  },
});

const mysqlDiagram = `erDiagram
  users {
    int id PK
    string name
    string email
    string phone
    string password_hash
    string role
    bool is_active
    timestamp created_at
  }
  addresses {
    int id PK
    int user_id FK
    string label
    string main_line
    string locality
    string city
    string pincode
    string state
    string country
    bool is_default
  }
  carts {
    int id PK
    int user_id FK
    timestamp updated_at
  }
  cart_items {
    int id PK
    int cart_id FK
    string item_id
    int quantity
    string snapshot_name
    string snapshot_image
    decimal snapshot_price
    string variant_label
    string snapshot_category
    timestamp added_at
  }
  orders {
    int id PK
    int user_id FK
    string ship_name
    string ship_main_line
    string ship_locality
    string ship_city
    string ship_pincode
    string ship_state
    string ship_country
    string status
    decimal total
    timestamp placed_at
  }
  order_items {
    int id PK
    int order_id FK
    string item_id
    int quantity
    string snapshot_name
    string snapshot_image
    decimal snapshot_price
    string variant_label
    string snapshot_category
  }
  sessions {
    int id PK
    int user_id FK
    string token
    timestamp expires_at
  }

  users ||--o{ addresses : "has"
  users ||--|| carts : "owns"
  users ||--o{ orders : "places"
  users ||--o{ sessions : "auth"
  carts ||--o{ cart_items : "contains"
  orders ||--o{ order_items : "contains"
`;

const { svg: mysqlSvg } = await mermaid.render('mysql-svg', mysqlDiagram);
document.getElementById('mysql-erd').innerHTML = mysqlSvg;

function roundNodes(containerId) {
  document.querySelectorAll(`#${containerId} svg.erDiagram .node`).forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });
  document.querySelectorAll(
    `#${containerId} svg.erDiagram .row-rect-odd path, #${containerId} svg.erDiagram .row-rect-even path`
  ).forEach(p => p.setAttribute('stroke', 'none'));
}

roundNodes('mysql-erd');

const mongoDiagram = `erDiagram
  products {
    ObjectId _id PK
    string name
    string description
    string category
    string[] images
    object attributes
    bool is_active
    timestamp created_at
  }
  items {
    ObjectId _id PK
    ObjectId product_id FK
    string variant_label
    string name
    string image
    decimal price
    string category
    int stock_count
    bool is_available
  }

  products ||--o{ items : "has variants"
`;

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: 'sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: 'sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#083830' : '#E1F5EE',
    primaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    primaryTextColor: dark ? '#9FE1CB' : '#085041',
    secondaryColor: dark ? '#1a3340' : '#E6F1FB',
    tertiaryColor: dark ? '#2a2826' : '#F1EFE8',
  },
});

const { svg: mongoSvg } = await mermaid.render('mongo-svg', mongoDiagram);
document.getElementById('mongo-erd').innerHTML = mongoSvg;
roundNodes('mongo-erd');
</script>
</body>
</html>
